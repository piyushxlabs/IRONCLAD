schema_version: "1.0"
agent:
  name: "ironclad-sentinel"
  description: "Autonomous Tri-Track Construction Compliance Cascade for AIA G702/G703 Invoices, Retainage Math, Lien Waivers, and Prompt-Pay Statutory Enforcement."
  version: "1.0.0"
  runtime:
    type: "python"
    version: "3.11"
    entrypoint: "src.main:app"
    protocol: "bedrock-agentcore-v1"
    container:
      dockerfile: "Dockerfile"
      port: 8080
      health_check:
        path: "/ping"
        interval_seconds: 30
        timeout_seconds: 5
        unhealthy_threshold: 3
    resources:
      memory_mb: 2048
      cpu_units: 1024
      idle_timeout_seconds: 900
    environment:
      IRONCLAD_RUNTIME_MODE: "bedrock"
      BEDROCK_REGION: "us-east-1"
      BEDROCK_PRIMARY_MODEL_ID: "us.anthropic.claude-3-5-sonnet-20241022-v2:0"
      BEDROCK_SECONDARY_MODEL_ID: "us.anthropic.claude-3-5-haiku-20241022-v1:0"
      OPENTELEMETRY_ENABLED: "true"
      LANGFUSE_HOST: "https://cloud.langfuse.com"
